<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8"/>
    <title>Mosa-SPA Simplified – 3-Column Design</title>
    <meta content="width=device-width,initial-scale=1" name="viewport"/>

    <style>
        /* ---------- 1. CSS-Variablen ---------- */
        :root {
            --bg: #fdfaf5;
            --card: #fffdf9;
            --border: #e2dcd2;
            --accent: #9ac99a;
            --new-indicator: #ff6b6b;
        }

        /* ---------- 2. Basis-Layout ---------- */
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        html, body {
            margin: 0;
            height: 100%;
        }

        body {
            background: var(--bg);
        }

        header {
            position: sticky;
            top: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-bottom: 1px solid #ddd;
            background: var(--bg);
        }

        #search {
            flex: 1;
            padding: 8px 12px;
            font-size: 16px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #555;
        }

        .user-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        /* ---------- 3. Spalten-Layout ---------- */
        #columns {
            display: flex;
            overflow-x: auto;
            height: calc(100vh - 60px);
        }

        .column {
            flex: 0 0 360px;
            border-right: 1px solid #ddd;
            padding: 8px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        /* ---------- 4. Karten (Posts) ---------- */
        .card {
            position: relative;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: box-shadow .15s, transform .25s ease;
        }

        .card:hover {
            box-shadow: 0 2px 6px rgba(0,0,0,.15);
        }

        .card.selected {
            border: 2px solid var(--accent);
            box-shadow: 0 0 0 1px rgba(154, 201, 154, 0.3);
            background: rgba(154, 201, 154, 0.05);
        }

        .card.pinned {
            position: sticky;
            top: 0;
            z-index: 3;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 50%, #bbf7d0 100%);
            border: 2px solid rgba(34, 197, 94, 0.4);
            box-shadow:
                0 8px 32px rgba(34, 197, 94, 0.15),
                0 4px 16px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.9),
                inset 0 -1px 0 rgba(34, 197, 94, 0.1);
            margin-bottom: 16px;
            transform: scale(0.98);
            opacity: 0.95;
            cursor: default;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
            overflow: visible; /* Wichtig für die Button-Leisten */
        }

        .card.pinned:hover {
            transform: scale(1);
            opacity: 1;
            box-shadow:
                0 12px 40px rgba(34, 197, 94, 0.2),
                0 6px 20px rgba(0, 0, 0, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 1),
                inset 0 -1px 0 rgba(34, 197, 94, 0.2);
        }

        .card.pinned::after {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 12px;
            right: 12px;
            height: 3px;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(34, 197, 94, 0.3) 20%,
                rgba(34, 197, 94, 0.8) 50%,
                rgba(34, 197, 94, 0.3) 80%,
                transparent 100%);
            border-radius: 2px;
            box-shadow: 0 1px 3px rgba(34, 197, 94, 0.3);
        }

        .card.pinned .post-body {
            color: #166534;
            font-weight: 600;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
        }

        .card.pinned .post-author {
            color: #15803d;
            font-weight: 700;
        }

        .card.pinned .status-line {
            opacity: 0.8;
            color: #166534;
        }

        .post-body {
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 6px;
            color: #333;
        }

        .post-author {
            font-size: 12px;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 4px;
            padding-bottom: 3px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-line {
            position: absolute;
            bottom: 6px;
            left: 8px;
            width: calc(100% - 16px);
            font-size: 12px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Neue Bömmel-Indikatoren */
        .new-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--new-indicator);
            display: inline-block;
            animation: pulse-glow 2s infinite;
            flex-shrink: 0;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.3); }
        }

        /* Spezielle Styling für Topic-Karten */
        .card.topic {
            position: relative;
        }

        .card.topic .post-author {
            padding-right: 32px; /* Platz für den Favoriten-Stern */
        }

        .card.topic .favorite {
            opacity: 1;
            visibility: visible;
            position: absolute;
            top: 6px; /* Angepasst für bessere Ausrichtung zur Kopfzeile */
            right: 8px;
            font-size: 18px; /* Etwas kleiner für bessere Proportionen */
            color: #bbb;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 4;
            line-height: 1; /* Verhindert zusätzlichen Zeilenabstand */
        }

        .card.topic .favorite.fav {
            color: #f5b400;
        }

        .card.topic .post-body {
            padding-right: 0px; /* Kein extra Platz mehr nötig */
        }

        /* Angeheftete Karten Button-Leiste */
        .pinned-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            width: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 0;
            background: transparent;
            border-radius: 0;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.2s ease;
            z-index: 10;
        }

        .card.pinned:hover .pinned-actions {
            opacity: 1;
            transform: scale(1);
        }

        .pinned-action-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            background: rgba(25, 118, 210, 0.9);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .pinned-action-btn:hover {
            background: rgba(20, 86, 163, 0.95);
            transform: scale(1.1);
        }

        .pinned-action-btn.loading {
            background: rgba(102, 102, 102, 0.9);
        }

        .pinned-action-btn.loading .action-icon {
            animation: spin 1s linear infinite;
        }

        .pinned-action-btn.add-btn {
            background: rgba(34, 197, 94, 0.9);
        }

        .pinned-action-btn.add-btn:hover {
            background: rgba(22, 163, 74, 0.95);
        }

        .pinned-action-btn.magnet-btn-pinned {
            background: rgba(154, 201, 154, 0.9);
        }

        .pinned-action-btn.magnet-btn-pinned:hover {
            background: rgba(124, 172, 124, 0.95);
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .card .reply-btn,
        .card .favorite,
        .card .magnet-btn {
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            z-index: 4;
        }

        .card:hover .reply-btn,
        .card:hover .favorite,
        .card:hover .magnet-btn {
            opacity: 1;
            visibility: visible;
        }

        .card.pinned .reply-btn,
        .card.pinned .favorite,
        .card.pinned .magnet-btn {
            display: none;
        }

        .reply-btn {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: rgba(25, 118, 210, 0.9);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .reply-btn:hover {
            background: rgba(20, 86, 163, 0.95);
            transform: scale(1.1);
        }

        .magnet-btn {
            position: absolute;
            bottom: 8px;
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: rgba(154, 201, 154, 0.9);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .magnet-btn:hover {
            background: rgba(124, 172, 124, 0.95);
            transform: scale(1.1);
        }

        /* Positionierung für Posts (unten rechts) */
        .column[data-depth="1"] .card .magnet-btn {
            right: 8px;
        }

        /* Horizontale Button-Leiste für Replies */
        .column[data-depth="2"] .card .reply-actions {
            position: absolute;
            bottom: 8px;
            right: 8px;
            display: flex;
            gap: 6px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            z-index: 4;
        }

        .column[data-depth="2"] .card:hover .reply-actions {
            opacity: 1;
            visibility: visible;
        }

        .column[data-depth="2"] .card .reply-actions .magnet-btn,
        .column[data-depth="2"] .card .reply-actions .reply-btn {
            position: static;
            opacity: 1;
            visibility: visible;
        }

        .favorite {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 20px;
            color: rgba(187, 187, 187, 0.9);
            cursor: pointer;
            transition: all 0.2s ease;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
            z-index: 4;
        }

        .favorite.fav {
            color: rgba(245, 180, 0, 0.95);
        }

        /* Referenz-Styling */
        .reply-reference {
            background: #f0f8ff;
            border-left: 3px solid var(--accent);
            padding: 4px 6px;
            margin: 4px 0;
            font-size: 12px;
            color: #666;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .reply-reference:hover {
            background: #e6f3ff;
        }

        .reply-reference::before {
            content: "↳ ";
            color: var(--accent);
            font-weight: bold;
        }

        /* ---------- 5. Floating-Action-Button ---------- */
        #fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border: none;
            border-radius: 50%;
            font-size: 32px;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,.3);
            transition: transform .3s;
        }

        #fab:hover {
            transform: rotate(135deg);
        }

        /* ---------- 6. Modal Overlay ---------- */
        #overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.4);
            z-index: 10;
            align-items: center;
            justify-content: center;
        }

        #modal {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 90%;
            max-width: 500px;
            padding: 20px;
            background: #fff;
            border-radius: 6px;
        }

        #modal textarea {
            width: 100%;
            height: 120px;
            padding: 8px;
        }

        .btn-row {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        button.btn {
            padding: 6px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button.primary {
            background: #1976d2;
            color: #fff;
        }

        button.secondary {
            background: #eee;
        }

        /* ---------- 7. Animationen ---------- */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 var(--accent); }
            70% { box-shadow: 0 0 0 12px rgba(154,201,154,0); }
            100% { box-shadow: 0 0 0 0 rgba(154,201,154,0); }
        }

        .slide-down {
            animation: slide-down .25s ease-out;
        }

        @keyframes slide-down {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }

        #logo {
            width: 36px;
            height: 24px;
            flex: none;
        }

        /* ---------- 8. Screen Reader Accessibility ---------- */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0,0,0,0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>

    <input id="search"
           aria-label="Neues Thema eingeben"
           placeholder="Neues Thema"
           type="text"/>

    <div class="user-info">
        <div class="user-icon" title="Benutzer">👤</div>
        <span>Max Schmidt</span>
    </div>
</header>

<!-- ======= Dynamische Spalten-Container ======= -->
<main id="columns">
    <!-- Themen-Spalte (Depth 0) -->
    <div class="column" data-depth="0" id="topicsColumn"></div>
</main>

<!-- Floating-Action-Button zum Erstellen eines Root-Posts -->
<button id="fab" aria-label="Neuen Root-Post verfassen" title="Neuen Root-Post verfassen">＋</button>

<!-- Modal-Dialog für neue Posts / Replies -->
<div id="overlay">
    <div id="modal">
        <h3 id="modalTitle">Neuer Beitrag</h3>
        <div id="replyReference" style="display: none;"></div>
        <label for="postText" class="sr-only">Beitragstext</label>
        <textarea id="postText"
                  aria-label="Dein Text"
                  placeholder="Dein Text …"></textarea>
        <div class="btn-row">
            <button class="btn secondary" id="cancelBtn">Abbrechen</button>
            <button class="btn primary" id="publishBtn">Veröffentlichen</button>
        </div>
    </div>
</div>

<script>
    /* --------------------------------------------------------------------
       0. Hilfsfunktionen & Konstanten
    -------------------------------------------------------------------- */

    const currentUser = "Max Schmidt";

    const lorem =
      "Lorem ipsum dolor sit amet, consectetur adipiscing elit. " +
      "Sed non risus. Suspendisse lectus tortor, dignissim sit amet.";

    const rnd = n => Math.floor(Math.random() * n) + 1;

    function snippet(prefix = "") {
      const len = rnd(400) + 100;
      let txt = "";
      while (txt.length < len) txt += " " + lorem;
      const fullText = prefix + " " + txt;
      return fullText.substring(0, len);
    }

    const longTopics = [
      "Die Herausforderungen und Chancen, die Städte weltweit im Rahmen der fortschreitenden Urbanisierung und des Klimawandels bewältigen müssen",
      "Politische, juristische und wirtschaftliche Auswirkungen der neuen EU-Datenschutzrichtlinien auf mittelständische Unternehmen in Deutschland",
      "Praxisberichte zum Einsatz der Programmiersprache Rust in kritischen Systemen und Performance-kritischen Anwendungen verschiedener Branchen",
      "Evaluierung von Open-Source-Alternativen zu proprietären Cloud-Plattformen unter Berücksichtigung von Sicherheit, Skalierbarkeit und Kosten",
      "Aktuelle psychologische Studien zur Wirkung intensiver Nutzung sozialer Medien auf die mentale Gesundheit von Jugendlichen und jungen Erwachsenen",
      "Technologische Fortschritte bei lasergetriebenen Fusionsreaktoren und deren potenzielle Bedeutung für die globale Energiewende",
      "Historische Analysen von Handelsrouten der Seidenstraße und deren Einfluss auf kulturellen und technologischen Austausch zwischen Ost und West",
      "Nachhaltige Landwirtschaft: Moderne Methoden und internationale Fallstudien zur Reduzierung des ökologischen Fußabdrucks in der Nahrungsmittelproduktion",
      "Auswirkungen von Künstlicher Intelligenz auf kreative Branchen, Arbeitsplätze und rechtliche Fragen des Urheberrechts im digitalen Zeitalter",
      "Interdisziplinäre Ansätze in der Krebstherapieforschung: Kombinationen aus Immuntherapie, Nanotechnologie und personalisierten Behandlungskonzepten"
    ];

    const authorNames = [
      "Anna Weber", "Max Schmidt", "Sarah Johnson", "David Chen",
      "Maria González", "Tom Anderson", "Lisa Müller", "Chris Taylor",
      "Nina Rossi", "Alex Kim", "Emma Brown", "Lucas Dubois",
      "Zara Patel", "Jonas Berg", "Sofia Larsson", "Ben Wilson",
      "Mia Fischer", "Ryan O'Connor", "Lea Kowalski", "Sam Rivera"
    ];

    function getRandomAuthor() {
      return authorNames[Math.floor(Math.random() * authorNames.length)];
    }

    function createAuthorElement(authorName, hasNew = false) {
      const authorDiv = document.createElement("div");
      authorDiv.className = "post-author";

      const nameSpan = document.createElement("span");
      nameSpan.textContent = authorName;
      authorDiv.appendChild(nameSpan);

      if (hasNew) {
        const indicator = document.createElement("div");
        indicator.className = "new-indicator";
        authorDiv.appendChild(indicator);
      }

      return authorDiv;
    }

    function createPinnedActions(columnType) {
      const actionsDiv = document.createElement("div");
      actionsDiv.className = "pinned-actions";

      // Reload-Button für alle Spalten
      const reloadBtn = document.createElement("button");
      reloadBtn.className = "pinned-action-btn reload-btn";
      reloadBtn.title = "Aktualisieren";

      const reloadIcon = document.createElement("span");
      reloadIcon.className = "action-icon";
      reloadIcon.textContent = "↻";
      reloadBtn.appendChild(reloadIcon);

      reloadBtn.onclick = e => {
        e.stopPropagation();
        startRefresh(reloadBtn);
      };

      actionsDiv.appendChild(reloadBtn);

      // Magnet-Button nur für Replies-Spalte (da dort ein Post angepinnt ist)
      if (columnType === 'replies') {
        const magnetBtn = document.createElement("button");
        magnetBtn.className = "pinned-action-btn magnet-btn-pinned";
        magnetBtn.title = "Sammlungs-Topic erstellen";

        const magnetIcon = document.createElement("span");
        magnetIcon.className = "action-icon";
        magnetIcon.textContent = "🧲";
        magnetBtn.appendChild(magnetIcon);

        magnetBtn.onclick = e => {
          e.stopPropagation();

          // Content aus der angehefteten Karte extrahieren
          const pinnedCard = e.target.closest('.card.pinned');
          if (pinnedCard) {
            const postBody = pinnedCard.querySelector('.post-body');
            if (postBody) {
              const contentText = postBody.textContent.trim();
              createNewTopicFromContent(contentText, currentUser);
            }
          }
        };

        actionsDiv.appendChild(magnetBtn);
      }

      // Add-Button nur für Replies-Spalte
      if (columnType === 'replies') {
        const addBtn = document.createElement("button");
        addBtn.className = "pinned-action-btn add-btn";
        addBtn.title = "Antwort hinzufügen";

        const addIcon = document.createElement("span");
        addIcon.className = "action-icon";
        addIcon.textContent = "+";
        addBtn.appendChild(addIcon);

        addBtn.onclick = e => {
          e.stopPropagation();

          // Neuen Reply-Dialog ohne Referenz öffnen
          replyTarget = {
            depth: 2, // Immer in der Replies-Spalte
            parentCard: null, // Kein spezifischer Parent
            isReplyToReply: false, // Kein Reply auf einen spezifischen Reply
            referencedReply: null // Keine Referenz
          };

          modalTitle.textContent = "Neue Antwort";
          replyReference.style.display = "none"; // Keine Referenz anzeigen
          postText.value = "";
          overlay.style.display = "flex";
          setTimeout(() => postText.focus(), 100);
        };

        actionsDiv.appendChild(addBtn);
      }

      return actionsDiv;
    }

    function startRefresh(refreshBtn) {
      refreshBtn.classList.add("loading");
      refreshBtn.disabled = true;

      setTimeout(() => {
        refreshBtn.classList.remove("loading");
        refreshBtn.disabled = false;
      }, 5000);
    }

    /* --------------------------------------------------------------------
       1. DOM-Referenzen
    -------------------------------------------------------------------- */
    const columns = document.getElementById("columns");
    const overlay = document.getElementById("overlay");
    const modalTitle = document.getElementById("modalTitle");
    const postText = document.getElementById("postText");
    const replyReference = document.getElementById("replyReference");

    let replyTarget = null;

    /* --------------------------------------------------------------------
       2. UI-Utility-Funktionen
    -------------------------------------------------------------------- */

    function clearDeeper(depth) {
      Array.from(columns.querySelectorAll(".column")).forEach(col => {
        if (parseInt(col.dataset.depth) > depth) {
          col.remove();
        }
      });
    }

    function select(depth, card) {
      // Entferne "selected" von allen Karten in derselben Spalte
      const column = columns.querySelector(`.column[data-depth="${depth}"]`);
      if (column) {
        column.querySelectorAll('.card.selected').forEach(selectedCard => {
          selectedCard.classList.remove('selected');
        });
      }

      // Füge "selected" zur geklickten Karte hinzu (aber nicht zu angehefteten Karten)
      if (card && !card.classList.contains('pinned')) {
        card.classList.add('selected');
      }
    }

    function magnetBtn(contentText) {
      const b = document.createElement("button");
      b.className = "magnet-btn";
      b.innerHTML = "🧲";
      b.title = "Sammlungs-Topic erstellen";

      b.onclick = e => {
        e.stopPropagation();
        createNewTopicFromContent(contentText, currentUser);
      };
      return b;
    }

    function createNewTopicFromContent(contentText, authorName = "Max Schmidt") {
      const card = document.createElement("div");
      card.className = "card topic";

      // Titelzeile mit Benutzername
      card.appendChild(createAuthorElement(authorName, false));

      const postBody = document.createElement("div");
      postBody.className = "post-body";
      const topicText = "Passend zu " + contentText;
      postBody.textContent = topicText;
      card.appendChild(postBody);

      const fav = document.createElement("span");
      fav.className = "favorite";
      fav.textContent = "☆";
      fav.onclick = e => {
        e.stopPropagation();
        fav.classList.toggle("fav");
        fav.textContent = fav.classList.contains("fav") ? "★" : "☆";
      };
      card.appendChild(fav);

      card.onclick = () => openPosts(card, topicText);

      const topicsCol = document.getElementById("topicsColumn");
      if (topicsCol.children.length > 1) {
        // Füge nach der angehefteten Header-Karte ein (children[1])
        topicsCol.insertBefore(card, topicsCol.children[1]);
      } else {
        topicsCol.appendChild(card);
      }

      // Automatisch das neue Topic öffnen, aber ohne den ursprünglichen Content als ersten Post
      openPosts(card, topicText);
    }

    function replyBtn(depth, isReplyToReply = false, referencedReply = null) {
      const b = document.createElement("button");
      b.className = "reply-btn";
      b.innerHTML = "↩";
      b.title = isReplyToReply ? "Auf diese Antwort antworten" : "Antworten";

      b.onclick = e => {
        e.stopPropagation();

        const card = e.target.closest('.card');
        if (card) {
          select(depth, card);
          clearDeeper(depth);
        }

        replyTarget = {
          depth: depth === 0 ? 1 : 2, // Topics -> Posts, Posts/Replies -> Replies
          parentCard: card,
          isReplyToReply: isReplyToReply,
          referencedReply: referencedReply
        };

        modalTitle.textContent = isReplyToReply ? "Auf Antwort antworten" : "Antwort verfassen";

        if (isReplyToReply && referencedReply) {
          replyReference.style.display = "block";
          replyReference.innerHTML = `<div class="reply-reference">Antwort auf: "${referencedReply.substring(0, 80)}..."</div>`;
        } else {
          replyReference.style.display = "none";
        }

        postText.value = "";
        overlay.style.display = "flex";
        setTimeout(() => postText.focus(), 100);
      };
      return b;
    }

    function ensureCol(depth, reset = true) {
      let col = columns.querySelector(`.column[data-depth="${depth}"]`);
      if (!col) {
        col = document.createElement("div");
        col.className = "column";
        col.dataset.depth = depth;
        columns.appendChild(col);
      }
      if (reset) col.innerHTML = "";
      clearDeeper(depth);
      columns.scrollLeft = columns.scrollWidth;

      // Topics-Spalte bekommt angeheftete Header-Karte
      if (depth === 0 && reset) {
        const pinnedHeader = document.createElement("div");
        pinnedHeader.className = "card pinned";

        const headerBody = document.createElement("div");
        headerBody.className = "post-body";
        const strong = document.createElement("strong");
        strong.textContent = "Topics";
        headerBody.appendChild(strong);
        pinnedHeader.appendChild(headerBody);

        col.appendChild(pinnedHeader);

        // Button-Leiste NACH dem Hinzufügen zur Spalte hinzufügen
        pinnedHeader.appendChild(createPinnedActions('topics'));
      }

      return col;
    }

    function addTopicCard(text, prepend = false, source = null) {
      const card = document.createElement("div");
      card.className = "card topic";

      // Titelzeile mit Quelle
      const sourceText = source || "pod://climate-research.org"; // Default Pod-URL für Demo
      card.appendChild(createAuthorElement(sourceText, Math.random() < 0.3));

      const postBody = document.createElement("div");
      postBody.className = "post-body";
      postBody.textContent = text; // Vollständiger Text
      card.appendChild(postBody);

      const fav = document.createElement("span");
      fav.className = "favorite";
      fav.textContent = "☆";
      fav.onclick = e => {
        e.stopPropagation();
        fav.classList.toggle("fav");
        fav.textContent = fav.classList.contains("fav") ? "★" : "☆";
      };
      card.appendChild(fav);

      // Kein Refresh-Button für normale Topic-Karten
      card.onclick = () => openPosts(card, text);

      const topicsCol = document.getElementById("topicsColumn");
      if (prepend && topicsCol.children.length > 1) {
        // Füge nach der angehefteten Header-Karte ein (children[1])
        topicsCol.insertBefore(card, topicsCol.children[1]);
      } else {
        topicsCol.appendChild(card);
      }
    }

    /* --------------------------------------------------------------------
       3. Navigations-Funktionen
    -------------------------------------------------------------------- */

    function openPosts(topicCard, topicText, firstPostText = null, firstPostAuthor = null) {
      select(0, topicCard);

      const col = ensureCol(1, true);

      // Topic-Karte als fancy Header oben anpinnen
      const pinnedTopic = topicCard.cloneNode(true);
      pinnedTopic.classList.add('pinned');
      pinnedTopic.classList.remove('selected', 'topic');

      // Nicht mehr klickbar machen
      pinnedTopic.onclick = null;
      pinnedTopic.style.cursor = 'default';

      col.appendChild(pinnedTopic);

      // Button-Leiste NACH dem Hinzufügen zur Spalte hinzufügen
      pinnedTopic.appendChild(createPinnedActions('posts'));

      const count = rnd(8) + 3;

      for (let i = 1; i <= count; i++) {
        const post = document.createElement("div");
        post.className = "card";

        const author = (i === 1 && firstPostAuthor) ? firstPostAuthor : getRandomAuthor();
        const hasNew = Math.random() < 0.4;
        post.appendChild(createAuthorElement(author, hasNew));

        const postBody = document.createElement("div");
        postBody.className = "post-body";

        if (i === 1 && firstPostText) {
          postBody.textContent = firstPostText;
        } else {
          postBody.textContent = snippet();
        }

        post.appendChild(postBody);

        // Magnet-Button für Posts hinzufügen
        post.appendChild(magnetBtn(postBody.textContent));

        post.addEventListener('click', function(e) {
          e.stopPropagation();
          openRepliesFixed(post, postBody.textContent);
        });

        col.appendChild(post);
      }
      col.scrollTop = 0;
    }

    // Richtige Implementierung für Replies
    function openRepliesFixed(postCard, postText) {
      select(1, postCard);
      const col = ensureCol(2, true);

      // Post-Karte als angehefteten Header verwenden
      const pinnedPost = document.createElement("div");
      pinnedPost.className = "card pinned";

      // Inhalt von der ursprünglichen Post-Karte kopieren (ohne Probleme)
      const originalAuthor = postCard.querySelector('.post-author');
      const originalBody = postCard.querySelector('.post-body');

      if (originalAuthor) {
        pinnedPost.appendChild(originalAuthor.cloneNode(true));
      }
      if (originalBody) {
        pinnedPost.appendChild(originalBody.cloneNode(true));
      }

      col.appendChild(pinnedPost);

      // Button-Leiste hinzufügen
      const actions = createPinnedActions('replies');
      pinnedPost.appendChild(actions);

      // Reply-Karten erstellen
      const cnt = rnd(8) + 2;
      for (let i = 1; i <= cnt; i++) {
        const reply = document.createElement("div");
        reply.className = "card";

        const hasNew = Math.random() < 0.2;
        reply.appendChild(createAuthorElement(getRandomAuthor(), hasNew));

        const replyBody = document.createElement("div");
        replyBody.className = "post-body";
        replyBody.textContent = snippet(`Antwort ${i}:`);
        reply.appendChild(replyBody);

        // Button-Leiste für Replies erstellen
        const replyActions = document.createElement("div");
        replyActions.className = "reply-actions";

        // Magnet-Button hinzufügen (erster in der Leiste)
        replyActions.appendChild(magnetBtn(replyBody.textContent));

        // Reply-Button hinzufügen (zweiter in der Leiste)
        replyActions.appendChild(replyBtn(2, true, replyBody.textContent));

        reply.appendChild(replyActions);

        // Click-Handler für Selektion hinzufügen
        reply.addEventListener('click', function(e) {
          e.stopPropagation();
          select(2, reply);
        });

        col.appendChild(reply);
      }

      col.scrollTop = 0;
      return true;
    }

    function testReplies() {
      return true;
    }

    function openReplies(postCard, postText) {
      select(1, postCard);

      const col = ensureCol(2, true);

      // Post-Karte als fancy Header oben anpinnen
      const pinnedPost = postCard.cloneNode(true);
      pinnedPost.classList.add('pinned');
      pinnedPost.classList.remove('selected');

      // Interaktive Elemente entfernen
      const refreshBtn = pinnedPost.querySelector('.refresh-btn');
      if (refreshBtn) refreshBtn.remove();
      const replyButton = pinnedPost.querySelector('.reply-btn');
      if (replyButton) replyButton.remove();

      // Nicht mehr klickbar machen
      pinnedPost.onclick = null;
      pinnedPost.style.cursor = 'default';

      col.appendChild(pinnedPost);

      const cnt = rnd(8) + 2;

      for (let i = 1; i <= cnt; i++) {
        const reply = document.createElement("div");
        reply.className = "card";

        const hasNew = Math.random() < 0.2;
        reply.appendChild(createAuthorElement(getRandomAuthor(), hasNew));

        const replyBody = document.createElement("div");
        replyBody.className = "post-body";
        replyBody.textContent = snippet(`Antwort ${i}:`);
        reply.appendChild(replyBody);

        // Nur Reply-Button für Replies, kein Refresh-Button
        reply.appendChild(replyBtn(2, true, replyBody.textContent));

        // Click-Handler für Selektion hinzufügen
        reply.addEventListener('click', function(e) {
          e.stopPropagation();
          select(2, reply);
        });

        col.appendChild(reply);
      }
      col.scrollTop = 0;
    }

    function createNewTopicWithPost(postText, authorName = "Max Schmidt") {
      const card = document.createElement("div");
      card.className = "card topic";

      // Titelzeile mit Benutzername für selbst erstellte Topics
      card.appendChild(createAuthorElement(authorName, false));

      const postBody = document.createElement("div");
      postBody.className = "post-body";
      const topicText = "Passend zu " + postText;
      postBody.textContent = topicText;
      card.appendChild(postBody);

      const fav = document.createElement("span");
      fav.className = "favorite";
      fav.textContent = "☆";
      fav.onclick = e => {
        e.stopPropagation();
        fav.classList.toggle("fav");
        fav.textContent = fav.classList.contains("fav") ? "★" : "☆";
      };
      card.appendChild(fav);

      // Kein Refresh-Button für normale Topic-Karten
      card.onclick = () => openPosts(card, topicText);

      const topicsCol = document.getElementById("topicsColumn");
      if (topicsCol.children.length > 1) {
        // Füge nach der angehefteten Header-Karte ein (children[1])
        topicsCol.insertBefore(card, topicsCol.children[1]);
      } else {
        topicsCol.appendChild(card);
      }

      openPosts(card, topicText, postText, authorName);
    }

    /* --------------------------------------------------------------------
       4. Initialisierung & Event-Listener
    -------------------------------------------------------------------- */

    // Initialisiere Topics-Spalte mit angehefteter Header-Karte
    const topicsCol = ensureCol(0, true);

    const podSources = [
      "pod://climate-research.org",
      "pod://tech-innovations.net",
      "pod://psychology-studies.edu",
      "pod://energy-future.com",
      "pod://historical-analysis.org",
      "pod://sustainable-farming.coop",
      "pod://ai-creative-impact.io",
      "pod://cancer-research.med"
    ];

    longTopics.forEach((topic, index) => {
      const podSource = podSources[index % podSources.length];
      addTopicCard(topic, false, podSource);
    });

    document.getElementById("search").addEventListener("keydown", e => {
      if (e.key === "Enter") {
        const v = e.target.value.trim();
        if (v) {
          addTopicCard(v, true, currentUser); // Benutzername für neue Topics aus der Suche
          e.target.value = "";
        }
      }
    });

    document.getElementById("fab").onclick = () => {
      replyTarget = null;
      modalTitle.textContent = "Neuen Root-Post schreiben";
      replyReference.style.display = "none";
      postText.value = "";
      overlay.style.display = "flex";
      setTimeout(() => postText.focus(), 100);
    };

    document.getElementById("cancelBtn").onclick = () => (overlay.style.display = "none");

    postText.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        if (e.ctrlKey || e.shiftKey) {
          return;
        } else {
          e.preventDefault();
          document.getElementById("publishBtn").click();
        }
      }
    });

    document.getElementById("publishBtn").onclick = () => {
      overlay.style.display = "none";

      const txt = postText.value.trim() || snippet("(neu)");
      const author = currentUser;

      if (replyTarget) {
        const col = ensureCol(replyTarget.depth, false);
        const card = document.createElement("div");
        card.className = "card";

        card.appendChild(createAuthorElement(author, false));

        const replyBody = document.createElement("div");
        replyBody.className = "post-body";

        if (replyTarget.isReplyToReply && replyTarget.referencedReply) {
          const reference = document.createElement("div");
          reference.className = "reply-reference";
          reference.textContent = `${replyTarget.referencedReply.substring(0, 80)}...`;
          card.appendChild(reference);
        }

        replyBody.textContent = txt;
        card.appendChild(replyBody);

        // Unterscheidung zwischen Posts (depth 1) und Replies (depth 2)
        if (replyTarget.depth === 2) {
          // Reply: Button-Leiste verwenden
          const replyActions = document.createElement("div");
          replyActions.className = "reply-actions";

          replyActions.appendChild(magnetBtn(replyBody.textContent));
          replyActions.appendChild(replyBtn(2, true, replyBody.textContent));

          card.appendChild(replyActions);
        } else {
          // Post: Einzelner Magnet-Button
          card.appendChild(magnetBtn(replyBody.textContent));
        }

        // Click-Handler für Selektion hinzufügen
        card.addEventListener('click', function(e) {
          e.stopPropagation();
          select(replyTarget.depth, card);
        });

        col.appendChild(card);

        // Scroll zum Ende der Spalte, damit der neue Reply sichtbar ist
        col.scrollTop = col.scrollHeight;

        select(replyTarget.depth, card);
      } else {
        createNewTopicWithPost(txt, author);
      }
    };

</script>
