kind: baseline
id: mosa-privacy-baseline
version: "1.0.0-draft2"
texts:
  de:
    - id: title
      text: |
        # Datenschutzerklärung

        Diese Datenschutzerklärung erklärt, wie {{string:controller_name}} bei {{string:service_name}} mit Ihren Daten umgeht, die sich auf Sie als Person beziehen.

        Stand: {{time:policy_effective_date}}

    - id: controller
      text: |
        ## Verantwortlicher

        Verantwortlich für die Datenverarbeitung (Art. 4 Nr. 7 DSGVO) ist:

        - {{string:controller_name}}
        - {{string:controller_address}}
        - E-Mail: {{string:controller_email}}
        - Web: {{string:controller_website??nicht angegeben}}

        Für Datenschutzanfragen: {{string:privacy_contact_email}}

    - id: data-protection-officer
      text: |
        ## Datenschutzbeauftragte Stelle

        Kontakt der Datenschutzbeauftragten Stelle (wenn gesetzlich nötig): {{string:dpo_contact_or_not_required??nicht erforderlich}}

    - id: service-description
      text: |
        ## Beschreibung des Dienstes

        {{string:service_name}} ist ein Text-Dienst. Sie können dort Beiträge veröffentlichen, auf Beiträge antworten, Beiträge suchen, Beiträge abrufen und eigene Beiträge löschen.

        Ihr Konto läuft nicht auf Ihren echten Namen, sondern auf einen automatisch erzeugten Kontonamen.

        Es werden nur die Daten genutzt, die {{string:service_name}} braucht, damit alles funktioniert und sicher bleibt.

    - id: categories-and-sources
      text: |
        ## Welche Daten verarbeitet werden und woher sie kommen

        In {{string:service_name}} werden vor allem diese Daten genutzt:

        - Kontodaten: Ihr Kontoname, Anmeldedaten und Angaben zu Ihrer Anmeldung
        - Inhalte: Ihre veröffentlichten Beiträge und Antworten
        - Zusätzliche Angaben zu Inhalten: welche Antwort zu welchem Beitrag gehört, von welchem Konto ein Inhalt stammt und wann er gespeichert wurde
        - Such- und Abrufdaten: was Sie suchen, welche Zeiträume Sie auswählen und welche Beiträge Sie anfragen
        - Daten für Sicherheit und Betrieb: Ihre Internetadresse und weitere nötige Verbindungsdaten, damit Missbrauch verhindert wird und {{string:service_name}} zuverlässig läuft

        Datenquelle:

        - Direkt von Ihnen, wenn Sie den Dienst nutzen
        - Daten über Sie werden nicht bei anderen Stellen eingeholt

        Hinweis: In Beiträgen können Sie frei schreiben. Angaben über andere Personen sollten Sie dabei allerdings nur machen, wenn Sie sich sicher sind, dass das erlaubt ist.

    - id: local-browser-processing
      text: |
        ## Lokale Verarbeitung im Browser

        Ein wichtiger Teil von {{string:service_name}} läuft direkt im Browser auf Ihrem eigenen Gerät.

        Dabei werden Daten auch lokal im Browser gespeichert, zum Beispiel:

        - veröffentlichte Beiträge und Antworten, die Sie abrufen
        - die Themenliste
        - welche Ihrer Konten im Browser gespeichert sind und welches davon gerade aktiv ist

        Gründe dafür sind Datenschutz und Geschwindigkeit: Ein Teil der Daten bleibt dadurch direkt auf Ihrem Gerät und damit unter Ihrer eigenen Kontrolle, und Inhalte können schneller angezeigt werden.

    - id: purposes-legal-bases
      text: |
        ## Warum Ihre Daten genutzt werden und warum das erlaubt ist

        Ihre Daten werden dafür genutzt:

        - damit {{string:service_name}} funktioniert (Beiträge veröffentlichen, antworten, suchen, abrufen, löschen; Art. 6 Abs. 1 lit. b DSGVO)
        - damit {{string:service_name}} sicher und stabil läuft (Art. 6 Abs. 1 lit. f DSGVO)
        - damit gesetzliche Pflichten erfüllt werden (Art. 6 Abs. 1 lit. c DSGVO)

        Berechtigte Interessen des Betreibers sind vor allem:

        - ein sicherer und stabiler Betrieb
        - Schutz vor Missbrauch und Angriffen
        - zuverlässige Such- und Antwortfunktionen

        Für die normalen Funktionen von {{string:service_name}} müssen Sie nicht extra zustimmen. Das ist rechtlich auch so erlaubt.

    - id: recipients-and-transfers
      text: |
        ## Wer Ihre Daten bekommt und ob Daten in andere Länder gehen

        Je nach Situation können Daten an diese Stellen gehen:

        - an den Betreiber von {{string:service_name}} und an Personen, die den Dienst betreuen
        - an externe Dienstleister für den technischen Betrieb: {{string:processors_categories_or_list??nicht gesondert benannt}}
        - an andere Nutzerinnen und Nutzer: veröffentlichte Beiträge und Antworten sind sichtbar und abrufbar

        Daten in andere Länder:

        - {{string:service_name}} wird weltweit genutzt. Deshalb können Daten auch in andere Länder gehen.
        - Wenn Daten gezielt an bestimmte Empfänger in solchen Ländern weitergegeben werden, wird das hier beschrieben.

    - id: recipients-and-transfers-third-country-details
      text: |
        - Eine vollständige Liste aller Länder ist nicht möglich.

    - id: retention
      text: |
        ## Speicherdauer

        Daten werden nur so lange gespeichert, wie sie für den Betrieb von {{string:service_name}} benötigt werden oder wie es gesetzlich vorgeschrieben ist.

        Für {{string:service_name}} gelten diese Zeiten:

        - Daten zur Internetverbindung und zur Sicherheit bei {{string:service_name}} (zum Beispiel Verbindungsdaten und Sicherheitsaufzeichnungen): {{duration:retention_log_data}}
        - Veröffentlichte Inhalte: {{duration:retention_user_content}}

        Für veröffentlichte Inhalte gilt außerdem:

    - id: retention_deletion
      text: |
        - Nach dem Löschen wird der Inhalt auf diesem Pod nicht mehr bereitgestellt und zeitnah entfernt.
        - Eine vollständige Löschung überall im Internet kann nicht garantiert werden. Das gilt auch für Ihre eigenen Beiträge und Antworten, wenn andere Nutzerinnen und Nutzer diese bereits auf ihren Geräten gespeichert haben.
        - Daten, die auf Ihrem eigenen Gerät gespeichert sind, bleiben dort, bis sie entfernt werden (durch Funktionen in {{string:service_name}}, durch den Browser oder durch Löschen der Browserdaten durch die nutzende Person). Ohne aktives Löschen können Beiträge zeitlich unbegrenzt auf Ihrem Gerät bleiben.

    - id: retention_backups
      text: |
        - Es werden keine zusätzlichen Kopien nur zur Aufbewahrung angelegt.

    - id: provision-obligation
      text: |
        ## Welche Angaben nötig sind

        Damit Sie geschützte Funktionen von {{string:service_name}} nutzen können, sind einige Angaben erforderlich:

        - ein Konto zur Anmeldung mit einem automatisch vergebenen Kontonamen sowie die nötigen Anmeldedaten
        - die Eingaben, die Sie bei der Nutzung selbst machen (zum Beispiel Suchanfragen oder Texte)

    - id: automated-decision-making
      text: |
        ## Keine automatisierten Entscheidungen

        Bei {{string:service_name}} gibt es keine Entscheidungen, die ausschließlich automatisiert getroffen werden und für Sie rechtliche oder ähnlich wichtige Folgen haben.

    - id: rights-and-self-service
      text: |
        ## Ihre Rechte und was Sie selbst verwalten können

        Sie haben diese Rechte. In {{string:service_name}} können Sie sie so nutzen:

        - Erfahren, welche Daten über Sie genutzt werden (Auskunft, Art. 15 DSGVO): Eigene Daten herunterladen
        - Eigene Daten in einem nutzbaren Format erhalten (Datenübertragbarkeit, Art. 20 DSGVO): Eigene Daten herunterladen
        - Fehler in Ihren Daten berichtigen (Berichtigung, Art. 16 DSGVO): Beiträge und Antworten löschen und neu veröffentlichen
        - Ihre Daten löschen (Löschung, Art. 17 DSGVO): Beiträge und Antworten löschen
        - Die Nutzung Ihrer Daten einschränken (Einschränkung, Art. 18 DSGVO): Festlegen, dass Beiträge und Antworten nicht mehr an andere Nutzerinnen und Nutzer ausgeliefert werden (einzeln, je Antwort oder für das ganze Konto)
        - Der Nutzung eigener Daten widersprechen (Widerspruch, Art. 21 DSGVO): in {{string:service_name}} nicht relevant, weil {{string:service_name}} nur Daten nutzt, die unbedingt nötig sind

        Für alle Datenschutzanfragen: {{string:privacy_contact_email}}

    - id: complaint
      text: |
        ## Ihr Beschwerderecht

        Wenn Sie finden, dass der Umgang mit Ihren Daten nicht korrekt ist, können Sie sich bei einer Datenschutzbehörde beschweren.

        Zuständige Datenschutzbehörde des Betreibers:

        - {{string:supervisory_authority_name}}
        - {{string:supervisory_authority_address}}
        - {{string:supervisory_authority_website}}

    - id: security-and-changes
      text: |
        ## Sicherheit und Änderungen

        Bei {{string:service_name}} wird darauf geachtet, dass Missbrauch verhindert wird und der Dienst zuverlässig läuft.

        Diese Datenschutzerklärung kann sich ändern, zum Beispiel wenn sich Gesetze oder die Technik ändern. Es gilt immer die neueste veröffentlichte Fassung.
