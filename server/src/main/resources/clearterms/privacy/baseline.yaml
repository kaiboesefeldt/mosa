kind: baseline
id: mosa-privacy-baseline
version: "1.0.0-draft2"
texts:
  de:
    - id: title
      text: |
        # Datenschutzerklärung

        Diese Datenschutzerklärung erklärt in einfacher Sprache, wie {{string:controller_name}} bei {{string:service_name}} mit Ihren persönlichen Daten umgeht.

        Stand: {{time:policy_effective_date}}

    - id: controller
      text: |
        ## Wer verantwortlich ist

        - {{string:controller_name}}
        - {{string:controller_address}}
        - E-Mail: {{string:controller_email}}
        - Web: {{string:controller_website??nicht angegeben}}

        Für Datenschutzanfragen: {{string:privacy_contact_email}}

    - id: data-protection-officer
      text: |
        ## Datenschutzkontakt

        Kontakt der Datenschutzbeauftragten Stelle (falls gesetzlich vorgeschrieben): {{string:dpo_contact_or_not_required??nicht erforderlich}}

    - id: service-description
      text: |
        ## Beschreibung des Dienstes

        {{string:service_name}} ist ein Text-Dienst. Sie können dort Beiträge veröffentlichen, auf Beiträge antworten, Beiträge suchen, Beiträge abrufen und eigene Beiträge löschen.

        Ihr Konto läuft nicht auf Ihren echten Namen, sondern auf einen automatisch erzeugten Kontonamen.

        Es werden nur die Daten genutzt, die {{string:service_name}} braucht, damit alles funktioniert und sicher bleibt.

    - id: categories-and-sources
      text: |
        ## Welche Daten verarbeitet werden und woher sie kommen

        In {{string:service_name}} werden vor allem diese Daten genutzt:

        - Kontodaten: Ihr Kontoname, Anmeldedaten und Angaben zu Ihrer Anmeldung
        - Inhalte: Ihre veröffentlichten Beiträge und Antworten
        - Zusätzliche Angaben zu Inhalten: welche Antwort zu welchem Beitrag gehört, von welchem Konto ein Inhalt stammt und wann er gespeichert wurde
        - Such- und Abrufdaten: was Sie suchen, welche Zeiträume Sie auswählen und welche Beiträge Sie anfragen
        - Daten für Sicherheit und Betrieb: Ihre Internetadresse (IP-Adresse) und nötige Verbindungsdaten (zum Beispiel Zeitpunkt des Zugriffs, aufgerufene Funktion und technische Fehlermeldungen), damit Missbrauch verhindert wird und {{string:service_name}} zuverlässig läuft

        Datenquelle:

        - Direkt von Ihnen, wenn Sie den Dienst nutzen
        - Daten über Sie werden nicht bei anderen Stellen eingeholt

        Hinweis: In Beiträgen können Sie frei schreiben. Angaben über andere Personen sollten Sie dabei allerdings nur machen, wenn Sie sich sicher sind, dass das erlaubt ist.

    - id: local-browser-processing
      text: |
        ## Lokale Verarbeitung im Browser

        Ein wichtiger Teil von {{string:service_name}} läuft direkt im Browser auf Ihrem eigenen Gerät.

        Dabei werden Daten auch lokal im Browser gespeichert, zum Beispiel:

        - veröffentlichte Beiträge und Antworten, die Sie abrufen
        - die Themenliste
        - welche Ihrer Konten im Browser gespeichert sind und welches davon gerade aktiv ist

        Gründe dafür sind Datenschutz und Geschwindigkeit: Ein Teil der Daten bleibt dadurch direkt auf Ihrem Gerät und damit unter Ihrer eigenen Kontrolle, und Inhalte können schneller angezeigt werden.

    - id: purposes-legal-bases
      text: |
        ## Wofür Ihre Daten gebraucht werden

        Ihre Daten werden dafür genutzt:

        - damit {{string:service_name}} funktioniert (Beiträge veröffentlichen, antworten, suchen, abrufen, löschen)
        - damit {{string:service_name}} sicher und stabil läuft
        - damit gesetzliche Pflichten erfüllt werden

        Warum das erlaubt ist:

        - weil die Daten nötig sind, damit der Dienst für Sie läuft
        - weil der Dienst vor Missbrauch geschützt werden muss
        - weil manche Daten gesetzlich verarbeitet werden müssen

        Für die normalen Funktionen von {{string:service_name}} ist keine zusätzliche Zustimmung nötig.
        Rechtsgrundlagen: Art. 6 Abs. 1 lit. b, c und f DSGVO.

    - id: recipients-and-transfers
      text: |
        ## Wer Ihre Daten bekommt und ob Daten in andere Länder gehen

        Je nach Situation können Daten an diese Stellen gehen:

        - an den Betreiber von {{string:service_name}} und an Personen, die den Dienst betreuen
        - an externe Anbieter, die beim technischen Betrieb helfen: {{string:processors_categories_or_list??nicht gesondert benannt}}
        - an andere Nutzerinnen und Nutzer: veröffentlichte Beiträge und Antworten sind sichtbar und abrufbar

        Daten in andere Länder:

        - {{string:service_name}} wird weltweit genutzt. Darum können veröffentlichte Inhalte auch außerhalb der EU gelesen werden.
        - Wenn Daten aktiv an Anbieter außerhalb der EU gesendet werden, geschieht das nur, wenn es nötig und rechtlich erlaubt ist. Dann gelten die EU-Datenschutzregeln für diese Anbieter.
        - Wenn Sie Details dazu möchten, schreiben Sie an {{string:privacy_contact_email}}.

    - id: recipients-and-transfers-third-country-details
      text: |
        - Eine vollständige, immer aktuelle Liste aller Länder, aus denen veröffentlichte Inhalte aufgerufen werden, ist nicht möglich.
        - Wenn veröffentlichte Inhalte nur aus dem Ausland aufgerufen werden, ist das keine gezielte Weitergabe durch {{string:service_name}}. Nur wenn Daten aktiv in Länder außerhalb der EU gesendet werden, wird festgehalten, an wen und warum die Daten gehen und wie sie geschützt werden.

    - id: retention
      text: |
        ## Speicherdauer

        Daten werden nur so lange gespeichert, wie sie für {{string:service_name}} gebraucht werden oder gesetzlich gespeichert werden müssen.

        Für {{string:service_name}} gelten diese Zeiten:

        - Daten zur Internetverbindung und zur Sicherheit bei {{string:service_name}} (zum Beispiel Zeitpunkt des Zugriffs, IP-Adresse und technische Fehlermeldung; bei Auffälligkeiten wie ungewöhnlich vielen Anfragen in kurzer Zeit auch die betroffene Nutzeridentität): {{duration:retention_log_data}}
        - Veröffentlichte Inhalte: {{duration:retention_user_content}}

        Für veröffentlichte Inhalte gilt außerdem:

    - id: retention_deletion
      text: |
        - Nach dem Löschen wird der Inhalt auf diesem Pod nicht mehr bereitgestellt und zeitnah entfernt.
        - Eine vollständige Löschung im ganzen Internet kann nicht versprochen werden. Das gilt auch für Ihre eigenen Beiträge und Antworten, wenn andere Nutzerinnen und Nutzer diese bereits auf ihren Geräten gespeichert haben.
        - Daten, die auf Ihrem eigenen Gerät gespeichert sind, bleiben dort, bis sie entfernt werden (durch Funktionen in {{string:service_name}}, durch den Browser oder durch Löschen der Browserdaten durch die nutzende Person). Ohne aktives Löschen können Beiträge zeitlich unbegrenzt auf Ihrem Gerät bleiben.

    - id: retention_backups
      text: |
        - Es werden keine extra Langzeit-Backups nur zur Aufbewahrung Ihrer Inhalte angelegt.
        - Kurzfristige Kopien für den Betrieb können entstehen und werden nach kurzer Zeit automatisch überschrieben oder gelöscht.

    - id: provision-obligation
      text: |
        ## Welche Angaben nötig sind

        Damit Sie geschützte Funktionen von {{string:service_name}} nutzen können, sind einige Angaben erforderlich:

        - ein Konto zur Anmeldung mit einem automatisch vergebenen Kontonamen sowie die nötigen Anmeldedaten
        - die Eingaben, die Sie bei der Nutzung selbst machen (zum Beispiel Suchanfragen oder Texte)

    - id: automated-decision-making
      text: |
        ## Keine automatisierten Entscheidungen

        Bei {{string:service_name}} gibt es keine Entscheidungen nur durch Computer, die für Sie erhebliche Folgen haben.

    - id: rights-and-self-service
      text: |
        ## Ihre Rechte und was Sie selbst verwalten können

        Sie haben diese Rechte. In {{string:service_name}} können Sie sie so nutzen:

        - Wissen, welche Daten über Sie vorliegen (Auskunft, Art. 15 DSGVO): Eigene Daten herunterladen
        - Eigene Daten mitnehmen (Datenübertragbarkeit, Art. 20 DSGVO): Eigene Daten herunterladen
        - Fehler korrigieren (Berichtigung, Art. 16 DSGVO): Inhalte löschen und richtig neu veröffentlichen
        - Daten löschen lassen (Löschung, Art. 17 DSGVO): Beiträge und Antworten löschen
        - Nutzung einschränken (Einschränkung, Art. 18 DSGVO): Sichtbarkeit eigener Inhalte begrenzen
        - Widersprechen (Art. 21 DSGVO): Widerspruch im Dienst einreichen, wenn Daten für Sicherheit und zuverlässigen Betrieb genutzt werden (rechtlich: berechtigtes Interesse)

        Für Funktionen, die nicht selbst in {{string:service_name}} erledigt werden können, und für andere Datenschutzanfragen: {{string:privacy_contact_email}}

    - id: complaint
      text: |
        ## Ihr Beschwerderecht

        Wenn Sie denken, dass mit Ihren Daten nicht richtig umgegangen wird, können Sie sich bei einer Datenschutzbehörde beschweren.

        Zuständige Datenschutzbehörde des Betreibers:

        - {{string:supervisory_authority_name}}
        - {{string:supervisory_authority_address}}
        - {{string:supervisory_authority_website}}

    - id: security-and-changes
      text: |
        ## Sicherheit und Änderungen

        Bei {{string:service_name}} gibt es Maßnahmen, damit Missbrauch erschwert wird und der Dienst zuverlässig läuft.

        Diese Datenschutzerklärung kann sich ändern, zum Beispiel wenn sich Gesetze, Funktionen oder die Technik ändern.
        Bei wesentlichen Änderungen gibt es eine klare Mitteilung auf {{string:controller_website}} oder direkt im Dienst.
        Jede Fassung trägt ein Datum. Es gilt die jeweils veröffentlichte Fassung ab dem angegebenen Stand.
