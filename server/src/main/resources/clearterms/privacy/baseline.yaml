kind: baseline
id: mosa-privacy-baseline
version: "1.0.0-draft2"
texts:
  de:
    - id: title
      text: |
        # Datenschutzerklärung

        Diese Datenschutzerklärung beschreibt, wie `{{string:controller_name}}` personenbezogene Daten bei der Nutzung von Mosa verarbeitet.

        Stand: `{{time:policy_effective_date}}`

    - id: controller
      text: |
        ## Verantwortlicher

        Verantwortlicher im Sinne von Art. 4 Nr. 7 DSGVO ist:

        - `{{string:controller_name}}`
        - `{{string:controller_address}}`
        - E-Mail: `{{string:controller_email}}`
        - Web: `{{string:controller_website}}`

        Datenschutzanfragen können gerichtet werden an: `{{string:privacy_contact_email}}`

    - id: data-protection-officer
      text: |
        ## Datenschutzbeauftragte Stelle

        Kontakt Datenschutzbeauftragte Stelle (falls gesetzlich zu benennen): `{{string:dpo_contact_or_not_required??nicht benötigt}}`

    - id: categories-and-sources
      text: |
        ## Kategorien personenbezogener Daten und Datenquellen

        Verarbeitete Kategorien personenbezogener Daten:

        - `{{string:data_categories_primary}}`
        - `{{string:data_categories_optional}}`

        Quellen der Daten:

        - Direkt bei betroffenen Personen erhoben: `{{string:data_source_direct_collection}}`
        - Nicht direkt erhobene Daten (Art. 14 DSGVO): `{{string:data_source_indirect_collection}}`
        - Herkunftsangaben bei indirekter Erhebung: `{{string:data_source_indirect_origin_details}}`

    - id: purposes-legal-bases
      text: |
        ## Zwecke und Rechtsgrundlagen

        Zwecke der Verarbeitung:

        - `{{string:processing_purposes_primary}}`
        - `{{string:processing_purposes_optional}}`

        Rechtsgrundlagen:

        - Art. 6 Abs. 1 lit. b DSGVO (Vertrag und vorvertragliche Maßnahmen): `{{string:legal_basis_contract_scope}}`
        - Art. 6 Abs. 1 lit. c DSGVO (rechtliche Verpflichtung): `{{string:legal_basis_legal_obligation_scope}}`
        - Art. 6 Abs. 1 lit. f DSGVO (berechtigte Interessen): `{{string:legal_basis_legitimate_interest_scope}}`
        - Konkrete berechtigte Interessen: `{{string:legitimate_interests_description}}`
        - Art. 6 Abs. 1 lit. a DSGVO (Einwilligung): `{{string:legal_basis_consent_scope}}`

    - id: recipients-and-transfers
      text: |
        ## Empfänger und Drittlandübermittlungen

        Empfänger bzw. Kategorien von Empfängern:

        - `{{string:recipients_categories}}`

        Eingesetzte Auftragsverarbeiter:

        - `{{string:processors_categories_or_list}}`

        Übermittlungen in Drittländer oder an internationale Organisationen:

        - Finden statt: `{{string:third_country_transfers_in_use}}`
        - Betroffene Drittländer/Organisationen: `{{string:third_country_transfer_targets}}`
        - Garantien nach Art. 44 ff. DSGVO: `{{string:third_country_transfer_safeguards}}`
        - Wie eine Kopie der Garantien erlangt werden kann: `{{string:third_country_transfer_safeguards_copy_info}}`

    - id: retention
      text: |
        ## Speicherdauer

        Personenbezogene Daten werden nur so lange gespeichert, wie es für die jeweiligen Zwecke erforderlich ist oder gesetzliche Aufbewahrungspflichten bestehen.

        Speicherdauern bzw. Kriterien:

        - Protokolldaten: `{{duration:retention_log_data}}`
        - Von Nutzerinnen und Nutzern veröffentlichte Inhalte: `{{duration:retention_user_content}}`
        - Weitere Kategorien und Kriterien: `{{string:retention_other_categories_and_criteria}}`

    - id: provision-obligation
      text: |
        ## Pflicht zur Bereitstellung von Daten

        Ob die Bereitstellung personenbezogener Daten gesetzlich oder vertraglich vorgeschrieben bzw. für einen Vertragsschluss erforderlich ist:

        - `{{string:data_provision_requirement}}`

        Mögliche Folgen der Nichtbereitstellung:

        - `{{string:data_provision_consequences}}`

    - id: automated-decision-making
      text: |
        ## Automatisierte Entscheidungen einschließlich Profiling

        Ob automatisierte Entscheidungen im Einzelfall einschließlich Profiling gemäß Art. 22 DSGVO stattfinden:

        - `{{string:automated_decision_making_in_use}}`

        Falls ja:

        - Aussagekräftige Informationen über involvierte Logik: `{{string:automated_decision_logic_details}}`
        - Tragweite und angestrebte Auswirkungen: `{{string:automated_decision_consequences}}`

    - id: rights-and-self-service
      text: |
        ## Ihre Rechte und Self-Service in Mosa

        Betroffene Personen haben nach DSGVO insbesondere folgende Rechte:

        - Auskunft (Art. 15 DSGVO)
        - Berichtigung (Art. 16 DSGVO)
        - Löschung (Art. 17 DSGVO)
        - Einschränkung der Verarbeitung (Art. 18 DSGVO)
        - Datenübertragbarkeit (Art. 20 DSGVO)
        - Widerspruch (Art. 21 DSGVO)
        - Widerruf erteilter Einwilligungen mit Wirkung für die Zukunft

        Self-Service-Abdeckung in Mosa:

        - Auskunft: `{{string:self_service_access}}`
        - Berichtigung: `{{string:self_service_rectification}}`
        - Löschung: `{{string:self_service_erasure}}`
        - Einschränkung: `{{string:self_service_restriction}}`
        - Datenübertragbarkeit: `{{string:self_service_portability}}`
        - Widerspruch: `{{string:self_service_objection}}`
        - Widerruf von Einwilligungen: `{{string:self_service_consent_withdrawal}}`

        Wenn ein Recht nicht vollständig im Self-Service ausübbar ist, erfolgt die Bearbeitung über: `{{string:privacy_contact_email}}`

    - id: complaint
      text: |
        ## Beschwerderecht bei Aufsichtsbehörde

        Es besteht ein Beschwerderecht bei einer Datenschutzaufsichtsbehörde, insbesondere bei:

        - `{{string:supervisory_authority_name}}`
        - `{{string:supervisory_authority_address}}`
        - `{{string:supervisory_authority_website}}`

    - id: security-and-changes
      text: |
        ## Sicherheit und Änderungen

        Es werden angemessene technische und organisatorische Maßnahmen eingesetzt, um personenbezogene Daten zu schützen.

        Diese Datenschutzerklärung kann angepasst werden, wenn sich rechtliche, technische oder organisatorische Rahmenbedingungen ändern. Maßgeblich ist die jeweils veröffentlichte Fassung.
