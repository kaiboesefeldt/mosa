texts:
  en:
    - id: policy-title
      text: |
        # Privacy Policy

        This privacy policy explains how {{string:ORG_CONTROLLER_NAME}} handles your personal data in {{string:SERVICE_DISPLAY_NAME}}.

        As of: {{time:DOC_EFFECTIVE_DATE}}

    - id: controller-details
      text: |
        ## Who is responsible

        - {{string:ORG_CONTROLLER_NAME}}
        - {{string:ORG_CONTROLLER_ADDRESS}}
        - Email: {{string:CONTACT_CONTROLLER_EMAIL}}
        - Web: {{string:URL_CONTROLLER_WEBSITE??not specified}}

        For privacy inquiries: {{string:CONTACT_PRIVACY_EMAIL}}

    - id: data-protection-contact
      text: |
        ## Data protection contact

        Contact for the data protection officer body: {{string:CONTACT_DPO_OR_NOT_REQUIRED??not required}}

    - id: service-description-heading
      text: |
        ## Description of the service

    - id: service-description-slot-service
      text: null
      hints:
        expectedContent: "Service-specific replacement required in derived profiles."
        override: once

    - id: data-use-principle
      text: |
        Only the data that {{string:SERVICE_DISPLAY_NAME}} needs for secure and reliable operation is used.

    - id: data-categories-heading
      text: |
        ## Which data is processed and where it comes from

        In {{string:SERVICE_DISPLAY_NAME}}, mainly this data is used:

    - id: data-categories-slot-service
      text: null
      hints:
        expectedContent: "Service-specific replacement required in derived profiles."
        override: once

    - id: data-categories-operational
      text: |
        - Security and operations data: your internet address (IP address) and required connection data (for example time of access, requested function, and technical error messages) to prevent misuse and keep {{string:SERVICE_DISPLAY_NAME}} running reliably

    - id: data-sources-heading
      text: "Where this data comes from:"

    - id: data-sources-list
      text: |
        - Directly from you when you use the service
        - Data about you is not obtained from other sources

    - id: data-sources-hint-slot-service
      text: null
      hints:
        expectedContent: "Service-specific replacement required in derived profiles."
        override: once

    - id: local-processing-slot-service
      text: null
      hints:
        expectedContent: "Service-specific replacement required in derived profiles."
        override: once

    - id: purposes-heading
      text: |
        ## What your data is used for

        Your data is used for:

    - id: purposes-list-slot-service
      text: null
      hints:
        expectedContent: "Service-specific replacement required in derived profiles."
        override: once

    - id: legal-basis-heading
      text: |
        Why this is allowed:

    - id: legal-basis-list
      text: |
        - because the data is necessary so that {{string:SERVICE_DISPLAY_NAME}} can operate for you
        - because {{string:SERVICE_DISPLAY_NAME}} must be protected from misuse
        - because some data must be processed by law

    - id: legal-basis-reference
      text: |
        No additional consent is required for the normal functions of {{string:SERVICE_DISPLAY_NAME}}.
        Legal bases: Art. 6(1)(b), (c), and (f) GDPR.

    - id: recipients-heading
      text: |
        ## Who receives your data and whether data is transferred to other countries

        Depending on the situation, data may be shared with:

    - id: recipients-list-default
      text: |
        - the operator of {{string:SERVICE_DISPLAY_NAME}} and people who maintain the service
        - external providers supporting technical operations: {{string:RECIPIENTS_PROCESSORS_INFO??not separately named}}

    - id: recipients-list-slot-service
      text: null
      hints:
        expectedContent: "Service-specific replacement required in derived profiles."
        override: once

    - id: third-country-transfers-heading
      text: |
        Data in other countries:

    - id: third-country-transfers-slot-service
      text: null
      hints:
        expectedContent: "Service-specific replacement required in derived profiles."
        override: once

    - id: third-country-transfers-conditions
      text: |
        - If data is actively sent to providers outside the EU, this only happens when necessary and legally permitted. In that case, EU data protection rules apply to those providers.
        - If you want details, write to {{string:CONTACT_PRIVACY_EMAIL}}.

    - id: third-country-transfers-detail-slot-service
      text: null
      hints:
        expectedContent: "Service-specific replacement required in derived profiles."
        override: once

    - id: retention-heading
      text: |
        ## Retention period

        Data is only stored as long as needed for {{string:SERVICE_DISPLAY_NAME}} or as long as legal retention obligations apply.

        These periods apply for {{string:SERVICE_DISPLAY_NAME}}:

    - id: retention-operational-logs
      text: |
        - Internet connection and security data in {{string:SERVICE_DISPLAY_NAME}} (for example time of access, IP address, and technical error messages; in case of anomalies such as unusually high request volumes in a short time also the affected user identity): {{duration:RETENTION_OPERATIONAL_LOG_DATA}}

    - id: retention-slot-service
      text: null
      hints:
        expectedContent: "Service-specific replacement required in derived profiles."
        override: once

    - id: retention-deletion-details-slot-service
      text: null
      hints:
        expectedContent: "Service-specific replacement required in derived profiles."
        override: once

    - id: retention-backups
      text: |
        - No extra long-term backups are created solely to retain your content.
        - Short-term technical copies may be created for operations and are automatically overwritten or deleted no later than after this period: {{duration:RETENTION_BACKUP_TECHNICAL_COPIES}}

    - id: provision-obligation-heading
      text: |
        ## Which information is required

    - id: provision-obligation-slot-service
      text: null
      hints:
        expectedContent: "Service-specific replacement required in derived profiles."
        override: once

    - id: automated-decisions
      text: |
        ## No automated decisions

        In {{string:SERVICE_DISPLAY_NAME}}, there are no decisions made only by computers that have significant effects for you.

    - id: rights-heading
      text: |
        ## Your rights

        You have the following rights. In {{string:SERVICE_DISPLAY_NAME}}, you can use them like this:

    - id: rights-access-label
      text: "- Know which data about you exists (access, Art. 15 GDPR): "
      hints:
        inlineWithNext: true

    - id: rights-access-action-slot-service
      text: Privacy request by email to {{string:CONTACT_PRIVACY_EMAIL}}
      hints:
        override: once

    - id: rights-portability-label
      text: "- Take your own data with you (data portability, Art. 20 GDPR): "
      hints:
        inlineWithNext: true

    - id: rights-portability-action-slot-service
      text: Privacy request by email to {{string:CONTACT_PRIVACY_EMAIL}}
      hints:
        override: once

    - id: rights-rectification-label
      text: "- Correct mistakes (rectification, Art. 16 GDPR): "
      hints:
        inlineWithNext: true

    - id: rights-rectification-action-slot-service
      text: Privacy request by email to {{string:CONTACT_PRIVACY_EMAIL}}
      hints:
        override: once

    - id: rights-erasure-label
      text: "- Have data deleted (erasure, Art. 17 GDPR): "
      hints:
        inlineWithNext: true

    - id: rights-erasure-action-slot-service
      text: Privacy request by email to {{string:CONTACT_PRIVACY_EMAIL}}
      hints:
        override: once

    - id: rights-restriction-label
      text: "- Restrict use (restriction, Art. 18 GDPR): "
      hints:
        inlineWithNext: true

    - id: rights-restriction-action-slot-service
      text: Privacy request by email to {{string:CONTACT_PRIVACY_EMAIL}}
      hints:
        override: once

    - id: rights-objection-label
      text: "- Object to the use of your data, including when data is used based on legitimate interests (for example security and reliable operation) (Art. 21 GDPR): "
      hints:
        inlineWithNext: true

    - id: rights-objection-action-slot-service
      text: Privacy request by email to {{string:CONTACT_PRIVACY_EMAIL}}
      hints:
        override: once

    - id: rights-other-requests
      text: |
        For functions that cannot be completed directly in {{string:SERVICE_DISPLAY_NAME}} and for other privacy requests: {{string:CONTACT_PRIVACY_EMAIL}}

    - id: complaint-right
      text: |
        ## Your right to complain

        If you think your data is not being handled correctly, you can complain to a data protection authority.

        Supervisory data protection authority of the operator:

        - {{string:AUTHORITY_SUPERVISORY_NAME}}
        - {{string:AUTHORITY_SUPERVISORY_ADDRESS}}
        - {{string:AUTHORITY_SUPERVISORY_WEBSITE}}

    - id: security-heading
      text: |
        ## Security

    - id: security-measures
      text: |
        In {{string:SERVICE_DISPLAY_NAME}}, measures are in place to make misuse harder and keep the service reliable.

    - id: policy-changes-heading
      text: |
        ## Changes

    - id: policy-changes
      text: |
        This privacy policy may change, for example when laws, features, or technology change.
        For major changes, a clear notice is provided on {{string:URL_CONTROLLER_WEBSITE}} or directly in the service.
        Each version carries a date. The published version applies from the stated effective date.
