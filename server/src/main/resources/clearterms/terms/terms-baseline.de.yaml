texts:
  de:
    - id: terms-title
      text: |
        # Allgemeine Geschäftsbedingungen für {{string:SERVICE_DISPLAY_NAME}}

        Stand: {{time:DOC_EFFECTIVE_DATE}}

    - id: service-purpose-heading
      text: |
        ## 1. Worum es hier geht

    - id: service-purpose-slot-service
      text: null
      hints:
        expectedContent: "Service-specific replacement required in derived profiles."
        override: once

    - id: eligibility-heading
      text: |
        ## 2. Wer den Dienst nutzen darf

    - id: eligibility-rule
      text: |
        Sie dürfen {{string:SERVICE_DISPLAY_NAME}} nur nutzen, wenn Sie sich an die Regeln in diesem Text halten.

    - id: account-heading
      text: |
        ## 3. Ihr Konto

    - id: account-details-slot-service
      text: null
      hints:
        expectedContent: "Service-specific replacement required in derived profiles."
        override: once

    - id: user-content-heading
      text: |
        ## 4. Ihre Inhalte

    - id: user-content-responsibility
      text: |
        Ihre Inhalte, das sind die Texte und Antworten, die Sie schreiben. Sie sind für Ihre Inhalte selbst verantwortlich.

        Sie dürfen nichts veröffentlichen, was anderen schadet oder was Sie nicht veröffentlichen dürfen, zum Beispiel fremde Texte, beleidigende Inhalte oder rechtswidrige Inhalte.

    - id: user-content-visibility-slot-service
      text: null
      hints:
        expectedContent: "Service-specific replacement required in derived profiles."
        override: once

    - id: service-rights-and-limits-heading
      text: |
        ## 5. Was der Dienst darf und was nicht

    - id: service-rights-slot-service
      text: null
      hints:
        expectedContent: "Service-specific replacement required in derived profiles."
        override: once

    - id: service-availability
      text: |
        {{string:SERVICE_DISPLAY_NAME}} bemüht sich um einen stabilen Betrieb. Eine ständige Verfügbarkeit wird aber nicht versprochen.

    - id: service-storage-limits
      text: |
        {{string:SERVICE_DISPLAY_NAME}} verspricht nicht, Inhalte für immer zu speichern. Inhalte können ganz oder teilweise verloren gehen oder gelöscht werden, wenn das aus sachlichen Gründen nötig ist, zum Beispiel bei Ausfällen, technischen Problemen, fehlendem Speicherplatz, Regeln zur Speicherdauer oder wenn der Betrieb endet.

    - id: user-data-control-heading
      text: |
        ## 6. Ihre Kontrolle über eigene Daten

    - id: user-data-control-slot-service
      text: null
      hints:
        expectedContent: "Service-specific replacement required in derived profiles."
        override: once

    - id: fair-use-heading
      text: |
        ## 7. Faire Nutzung

    - id: fair-use-rule
      text: |
        Sie dürfen {{string:SERVICE_DISPLAY_NAME}} nicht absichtlich stören. Dazu gehört zum Beispiel, den Dienst automatisch mit sehr vielen Anfragen zu überlasten oder für Spam zu nutzen.

    - id: liability-and-statutory-rights-heading
      text: |
        ## 8. Haftung und gesetzliche Rechte

    - id: liability-and-statutory-rights-reference
      text: |
        {{string:SERVICE_DISPLAY_NAME}} verspricht nicht, dass der Dienst immer verfügbar ist oder dass Inhalte dauerhaft gespeichert bleiben. Rechte, die Sie nach dem Gesetz zwingend haben, werden durch diesen Text nicht eingeschränkt. Soweit dieser Text nichts Besonderes regelt, gilt das Gesetz.

    - id: changes-heading
      text: |
        ## 9. Änderungen

    - id: changes-conditions
      text: |
        Diese Bedingungen können für die Zukunft geändert werden, wenn es dafür einen guten Grund gibt, zum Beispiel neue Funktionen, neue Gesetze oder Sicherheitsgründe. Die Änderungen müssen fair sein. Wir zeigen Ihnen die neue Fassung in {{string:SERVICE_DISPLAY_NAME}} an und stellen sie dort auch in speicherbarer Form mit Versionsstand bereit. Sie gilt erst, wenn Sie ihr zustimmen. Wenn Sie nicht zustimmen, können Sie {{string:SERVICE_DISPLAY_NAME}} nicht weiter nutzen.

    - id: changes-follow-up-slot-service
      text: ""
      hints:
        override: once

    - id: contact-heading
      text: |
        ## 10. Kontakt

    - id: contact-details
      text: |
        Betreiber: {{string:ORG_CONTROLLER_NAME}}
        Kontakt: {{string:CONTACT_CONTROLLER_EMAIL}}
