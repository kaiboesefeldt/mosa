[versions]
kotlin = "2.2.0"
ktor = "3.2.0"
koin = "4.1.0"
jackson = "2.17.2"
sqlite = "3.46.0.0"
exposed = "1.0.0-beta-2"
logback = "1.5.18"
kotlin-logging = "7.0.7"
djl = "0.33.0"
lucene = "9.9.0"
mockk = "1.14.4"
auth0-jwt = "4.5.0"

[libraries]
ktor-server-core = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty-jvm", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation-jvm", version.ref = "ktor" }
ktor-serialization-jackson = { module = "io.ktor:ktor-serialization-jackson-jvm", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth-jvm", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core-jvm", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio-jvm", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }

koin-ktor = { module = "io.insert-koin:koin-ktor", version.ref = "koin" }
koin-logger = { module = "io.insert-koin:koin-logger-slf4j", version.ref = "koin" }

exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }

lucene-core = { module = "org.apache.lucene:lucene-core", version.ref = "lucene" }
lucene-analysis-common = { module = "org.apache.lucene:lucene-analysis-common", version.ref = "lucene" }

jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }

djl-bom = { module = "ai.djl:bom", version.ref = "djl" }
djl-api = { module = "ai.djl:api" }
djl-model-zoo = { module = "ai.djl:model-zoo" }
djl-onnxruntime-engine = { module = "ai.djl.onnxruntime:onnxruntime-engine" }
djl-tokenizers = { module = "ai.djl.huggingface:tokenizers" }

bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "logback" }
bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "logback" }

auth0-jwt = { module = "com.auth0:java-jwt", version.ref = "auth0-jwt" }

kotlin-logging = { module = "io.github.oshai:kotlin-logging", version.ref = "kotlin-logging" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
